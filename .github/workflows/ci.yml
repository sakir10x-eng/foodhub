name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodhub
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foodhub?schema=public
      JWT_SECRET: ci-only-secret
      ENCRYPTION_KEY: ci-only-encryption-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      # Tenant isolation is the security-critical invariant here — these must never be
      # allowed to go red "temporarily".
      - name: Tests (tenant isolation, pricing, settlement)
        run: npm test

      - name: Typecheck + build
        run: npm run build

  web-vitals:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build -w @foodhub/web

      # Performance is a gate, not a report. A storefront that regresses past a 2.5s LCP
      # does not ship — that is the whole premise of the product.
      - name: Lighthouse budget
        run: npm run lighthouse
        env:
          LHCI_BUDGET_LCP_MS: '2500'
          LHCI_BUDGET_CLS: '0.1'
