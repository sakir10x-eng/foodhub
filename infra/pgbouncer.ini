; PgBouncer for FoodHub.
;
; Node opens a connection per Prisma client per process; Postgres costs ~10MB of RAM per
; backend and starts thrashing well before the connection count a horizontally-scaled API
; would naturally open. PgBouncer multiplexes: hundreds of client connections onto a small
; server pool.

[databases]
foodhub = host=postgres port=5432 dbname=foodhub
; Analytics and marketplace browsing point here; see REPLICA_DATABASE_URL.
foodhub_replica = host=postgres-replica port=5432 dbname=foodhub

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling gives the best multiplexing, but it breaks anything that assumes a
; session outlives a transaction: prepared statements, LISTEN/NOTIFY, session GUCs.
; Prisma must therefore connect with `pgbouncer=true` in the URL, which disables its
; prepared-statement cache:
;   DATABASE_URL="postgresql://…@pgbouncer:6432/foodhub?pgbouncer=true&connection_limit=1"
pool_mode = transaction

max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Our longest legitimate statement is the settlement rollup; anything past this is a
; runaway and should be killed rather than left holding a pooled backend.
query_timeout = 30
query_wait_timeout = 15
client_idle_timeout = 0
server_idle_timeout = 120

; Serializable transactions (settlement, order status) can be retried by the app, but a
; server-side cancel mid-transaction cannot — leave this off.
server_reset_query_always = 0

log_connections = 0
log_disconnections = 0
stats_period = 60

admin_users = foodhub_admin
stats_users = foodhub_stats
